# Redis 最小配置
bind 0.0.0.0
port 6379
protected-mode no
daemonize no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""
databases 16

# 持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 网络
tcp-keepalive 300
timeout 0
