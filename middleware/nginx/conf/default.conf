# Nginx 默认配置 - 开发环境健康检查与反向代理预留

server {
    listen 80;
    server_name localhost;

    # 健康检查端点
    location / {
        return 200 '{"status":"ok","service":"nginx","environment":"dev"}';
        add_header Content-Type application/json;
    }

    # 反向代理示例（按需启用）
    # location /api/ {
    #     proxy_pass http://host.docker.internal:9000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}

# 8080 端口示例配置
server {
    listen 8080;
    server_name localhost;

    location / {
        return 200 '{"status":"ok","port":8080,"service":"nginx"}';
        add_header Content-Type application/json;
    }
}