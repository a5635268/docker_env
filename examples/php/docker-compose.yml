services:
  php-app:
    image: php:8.2.16-fpm
    container_name: php-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: ["tail", "-f", "/dev/null"]
    networks:
      - shared-network
    depends_on:
      - mysql8
      - redis

  # 示例：连接 MySQL 8
  mysql8:
    external: true
    name: mysql8

  # 示例：连接 Redis
  redis:
    external: true
    name: redis

networks:
  shared-network:
    external: true